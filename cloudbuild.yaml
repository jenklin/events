# Custom Events - Cloud Build Configuration
# Builds Docker image and pushes to Google Container Registry
# Uses GCP Secret Manager for Supabase credentials

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_URI}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'SUPABASE_SERVICE_ROLE_KEY=${_SUPABASE_SERVICE_KEY}'
      - '--build-arg'
      - 'GALLERY_ORIGIN=${_GALLERY_ORIGIN}'
      - '.'
    timeout: '1200s'

  # Step 2: Push image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_URI}']
    timeout: '600s'

# Build configuration
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout (20 minutes)
timeout: '1200s'

# Store built image
images:
  - '${_IMAGE_URI}'

# Note: Secrets are passed via substitutions from deploy.sh
# Deploy script fetches from Secret Manager and passes as build args
